<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>HAL-style Tiles — D3 v7</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  :root{
    --tile-size: 360px;
    --bg-page: #0f1112;
    --font-sans: Inter, "Helvetica Neue", Arial, sans-serif;
    --font-mono: "Fira Mono", "Courier New", monospace;
  }
  html,body{height:100%; margin:0; background:var(--bg-page); font-family:var(--font-sans); color:#e8eef6;}
  .wrap { max-width: 1380px; margin:28px auto; padding:18px; display:grid; gap:22px;
    grid-template-columns: repeat(4, minmax(0, 1fr)); align-items:start;
  }

  .tile {
    width: var(--tile-size);
    height: var(--tile-size);
    background: transparent;
    border-radius:9px;
    box-shadow: 0 8px 22px rgba(0,0,0,0.6) inset;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  /* common styling for small labels inside svgs (monospace look) */
  .small-label { font-family: var(--font-mono); font-size:12px; fill: rgba(255,255,255,0.9); opacity:0.9; }
  .big-word  { font-family: Inter, "Segoe UI", sans-serif; font-weight:700; fill: #fff; letter-spacing:8px; text-anchor:middle; dominant-baseline:middle; }
  .axis-text { font-family: var(--font-mono); font-size:11px; fill: rgba(255,255,255,0.65); }

  /* tooltip common */
  .tooltip {
    position: absolute;
    background: rgba(18,20,22,0.95);
    color: #e8f1ff;
    padding:8px 10px;
    border-radius:6px;
    font-family:var(--font-mono);
    font-size:12px;
    pointer-events:none;
    box-shadow: 0 8px 20px rgba(0,0,0,0.6);
    display:none;
    z-index:100;
  }
</style>
</head>
<body>

<div class="wrap" id="grid"></div>

<div id="tooltip" class="tooltip"></div>

<script>
/* ====== Utility & palette ====== */
const TILE_W = 360, TILE_H = 360;
const palette = {
  purple: "#532B78",     // NAV
  teal:   "#1C6B74",     // teal engineering
  white:  "#ffffff",
  navy:   "#143962",     // MEM
  grey:   "#7B7B7B",     // grey engineering background
  darknav:"#0A1130",     // NUC
  burgundy:"#6B2424",    // burgundy engineering
  violet: "#54336F"      // purple waveform
};

const grid = d3.select("#grid");
const tooltip = d3.select("#tooltip");

/* helper to create an svg tile container */
function createTile(id) {
  const container = grid.append("div").attr("class","tile").attr("id", id);
  const svg = container.append("svg")
    .attr("viewBox", `0 0 ${TILE_W} ${TILE_H}`)
    .attr("width", TILE_W)
    .attr("height", TILE_H);
  return svg;
}

/* ---------------- Tile 1 — NAV (word panel) ---------------- */
(function tileNAV(){
  const svg = createTile("tile-nav");
  svg.append("rect").attr("width",TILE_W).attr("height",TILE_H).attr("fill", palette.purple).attr("rx",10);

  svg.append("text")
    .attr("x", 24).attr("y", 34)
    .attr("class","small-label")
    .text("RTE: 09-EF");

  svg.append("text")
    .attr("x", TILE_W/2).attr("y", TILE_H/2)
    .attr("class","big-word")
    .style("font-size","92px")
    .text("NAV");
})();

/* ---------------- Tile 2 — Teal engineering curves (family of decays) ---------------- */
(function tileTealCurves(){
  const svg = createTile("tile-teal");
  svg.append("rect").attr("width",TILE_W).attr("height",TILE_H).attr("fill", palette.teal).attr("rx",10);

  // margins and inner chart area
  const margin = {left:44, right:106, top:42, bottom:44};
  const w = TILE_W - margin.left - margin.right;
  const h = TILE_H - margin.top - margin.bottom;
  const g = svg.append("g").attr("transform", `translate(${margin.left},${margin.top})`);

  // grid
  const gx = d3.range(0,11).map(i => i * w/10);
  const gy = d3.range(0,6).map(i => i * h/5);
  g.append("g").selectAll("line").data(gx).join("line")
    .attr("x1", d=>d).attr("x2", d=>d).attr("y1",0).attr("y2",h)
    .attr("stroke", "rgba(255,255,255,0.06)");
  g.append("g").selectAll("line").data(gy).join("line")
    .attr("y1", d=>d).attr("y2", d=>d).attr("x1",0).attr("x2", w)
    .attr("stroke", "rgba(255,255,255,0.06)");

  // axes lines
  g.append("rect").attr("x",0).attr("y",0).attr("width",w).attr("height",h).attr("fill","none")
    .attr("stroke","rgba(255,255,255,0.06)");

  // scales
  const x = d3.scaleLinear().domain([0,1]).range([0,w]);
  const y = d3.scaleLinear().domain([0,1]).range([h,0]);

  // generate family of decay curves: y = a * exp(-b * x)
  const lines = d3.range(0,8).map(i => {
    const a = 0.95 - i*0.08;
    const b = 1.2 + i*0.6;
    const pts = d3.range(0,41).map(t=> {
      const xx = t/40;
      return [ x(xx), y(a * Math.exp(-b * xx)) ];
    });
    return pts;
  });

  // draw curves
  const lineGen = d3.line();
  g.append("g").selectAll("path.curve")
    .data(lines)
    .join("path")
    .attr("d", d=>lineGen(d))
    .attr("fill","none")
    .attr("stroke","rgba(255,255,255,0.95)")
    .attr("stroke-width",1.1)
    .attr("opacity",0.95);

  // right-side annotation block (monospace numbers)
  const annotations = [
    "0.95",
    "0.87",
    "0.79",
    "0.71",
    "0.63",
    "0.55",
    "0.47",
    "0.39"
  ];
  svg.append("rect").attr("x", TILE_W - 96).attr("y", 36).attr("width", 76).attr("height", 172)
    .attr("fill","rgba(255,255,255,0.03)").attr("rx",6);
  svg.append("g").attr("transform", `translate(${TILE_W-86},64)`)
    .selectAll("text").data(annotations).join("text")
    .attr("x",0).attr("y",(d,i)=>i*20)
    .attr("class","small-label")
    .text(d=>d);

  // top label
  svg.append("text").attr("x",24).attr("y",28).attr("class","small-label").text("IIIK-V8");

  // axis ticks bottom and left (simple)
  const xticks = d3.range(0,11).map(i => (i/10).toFixed(1));
  g.selectAll("text.xl")
    .data(xticks).join("text")
    .attr("x",(d,i)=> i * w/10)
    .attr("y", h + 16)
    .attr("class","axis-text")
    .attr("text-anchor","middle")
    .text(d=>d);

  const yticks = d3.range(0,6).map(i=> (i/5).toFixed(1));
  g.selectAll("text.yl")
    .data(yticks).join("text")
    .attr("x",-10)
    .attr("y",(d,i)=> h - i * h/5 + 4)
    .attr("class","axis-text")
    .attr("text-anchor","end")
    .text(d=>d);
})();

/* ---------------- Tile 3 — MEM (word panel) ---------------- */
(function tileMEM(){
  const svg = createTile("tile-mem");
  svg.append("rect").attr("width",TILE_W).attr("height",TILE_H).attr("fill", palette.navy).attr("rx",10);

  svg.append("text").attr("x", 28).attr("y", 36).attr("class","small-label").text("PMT: 48-XB");

  svg.append("text")
    .attr("x", TILE_W/2).attr("y", TILE_H/2)
    .attr("class","big-word")
    .style("font-size","92px")
    .text("MEM");
})();

/* ---------------- Tile 4 — Grey engineering (upward family/contour-like) ---------------- */
(function tileGreyCurves(){
  const svg = createTile("tile-grey");
  svg.append("rect").attr("width",TILE_W).attr("height",TILE_H).attr("fill", palette.grey).attr("rx",10);

  const margin = {left:48, right:36, top:40, bottom:48};
  const w = TILE_W - margin.left - margin.right;
  const h = TILE_H - margin.top - margin.bottom;
  const g = svg.append("g").attr("transform", `translate(${margin.left},${margin.top})`);

  // grid lines
  const gx = d3.range(0,9).map(i => i * w/8);
  const gy = d3.range(0,6).map(i => i * h/5);
  g.append("g").selectAll("line").data(gx).join("line")
    .attr("x1", d=>d).attr("x2", d=>d).attr("y1",0).attr("y2",h).attr("stroke","rgba(255,255,255,0.06)");
  g.append("g").selectAll("line").data(gy).join("line")
    .attr("y1", d=>d).attr("y2", d=>d).attr("x1",0).attr("x2", w).attr("stroke","rgba(255,255,255,0.06)");

  // generate family of upward concave curves resembling param sweep: y = c + k * log(1 + x)
  const x = d3.scaleLinear().domain([0,1]).range([0,w]);
  const y = d3.scaleLinear().domain([0,1]).range([h,0]);
  const families = d3.range(0,10).map(i=>{
    const base = 0.06 + i*0.08;
    const kt = 0.07 + i*0.035;
    return d3.range(0,60).map(t=>{
      const xx = t/59;
      const yy = base + kt * Math.log(1 + 5*xx);
      return [ x(xx), y(Math.min(0.98, yy)) ];
    });
  });

  const line = d3.line().curve(d3.curveMonotoneX);
  g.append("g").selectAll("path").data(families).join("path")
    .attr("d", d=>line(d))
    .attr("fill","none")
    .attr("stroke","rgba(255,255,255,0.92)")
    .attr("stroke-width",1)
    .attr("opacity",0.95);

  svg.append("text").attr("x",24).attr("y",28).attr("class","small-label").text("VEC(4)3");

  // axis ticks (bottom)
  const xt = d3.range(0,6).map(i => (i/5).toFixed(1));
  g.selectAll("text.xt").data(xt).join("text")
    .attr("x",(d,i)=> i * w/5).attr("y",h+18).attr("class","axis-text").text(d=>d).attr("text-anchor","middle");
})();

/* ---------------- Tile 5 — NUC (word panel) ---------------- */
(function tileNUC(){
  const svg = createTile("tile-nuc");
  svg.append("rect").attr("width",TILE_W).attr("height",TILE_H).attr("fill", palette.darknav).attr("rx",10);

  svg.append("text").attr("x", 26).attr("y", 36).attr("class","small-label").text("AGS: 64-VN");

  svg.append("text")
    .attr("x", TILE_W/2).attr("y", TILE_H/2)
    .attr("class","big-word")
    .style("font-size","92px")
    .text("NUC");
})();

/* ---------------- Tile 6 — Burgundy grid + convex curve ---------------- */
(function tileBurgundy(){
  const svg = createTile("tile-burgundy");
  svg.append("rect").attr("width",TILE_W).attr("height",TILE_H).attr("fill", palette.burgundy).attr("rx",10);

  const margin = {left:44, right:44, top:48, bottom:48};
  const w = TILE_W - margin.left - margin.right;
  const h = TILE_H - margin.top - margin.bottom;
  const g = svg.append("g").attr("transform", `translate(${margin.left},${margin.top})`);

  // grid: both axes
  const cols = 10, rows = 10;
  for(let i=0;i<=cols;i++){
    g.append("line").attr("x1", i * w/cols).attr("x2", i * w/cols).attr("y1", 0).attr("y2", h)
      .attr("stroke","rgba(255,230,230,0.07)");
  }
  for(let j=0;j<=rows;j++){
    g.append("line").attr("y1", j * h/rows).attr("y2", j * h/rows).attr("x1", 0).attr("x2", w)
      .attr("stroke","rgba(255,230,230,0.07)");
  }
  // axes border
  g.append("rect").attr("x",0).attr("y",0).attr("width",w).attr("height",h).attr("fill","none").attr("stroke","rgba(255,230,230,0.06)");

  // convex upward curve: model y = A * x^p
  const xScale = d3.scaleLinear().domain([0,1]).range([0,w]);
  const yScale = d3.scaleLinear().domain([0,1]).range([h,0]);
  const power = 2.4; // controls convexity
  const curvePts = d3.range(0,81).map(t => {
    const xx = t/80;
    const yy = 0.02 + 0.96 * Math.pow(xx, power);
    return [ xScale(xx), yScale(yy) ];
  });

  g.append("path")
    .attr("d", d3.line()(curvePts))
    .attr("fill","none")
    .attr("stroke","rgba(255,255,255,0.95)")
    .attr("stroke-width",2.2)
    .attr("stroke-linejoin","round")
    .attr("stroke-linecap","round");

  svg.append("text").attr("x",24).attr("y",30).attr("class","small-label").text("COMPT GRID");
})();

/* ---------------- Tile 7 — Purple waveform tile (two stacked waveform panels) ---------------- */
(function tilePurpleWave(){
  const svg = createTile("tile-wave");
  svg.append("rect").attr("width",TILE_W).attr("height",TILE_H).attr("fill", palette.violet).attr("rx",10);

  const margin = {left:34, right:26, top:42, bottom:44};
  const w = TILE_W - margin.left - margin.right;
  const h = TILE_H - margin.top - margin.bottom;
  const panelGap = 18;
  const panelH = (h - panelGap) / 2;

  const gTop = svg.append("g").attr("transform", `translate(${margin.left},${margin.top})`);
  const gBot = svg.append("g").attr("transform", `translate(${margin.left},${margin.top + panelH + panelGap})`);

  // function to generate noisy waveform
  function waveform(n, freq, amp, phase){
    return d3.range(0,n).map(i => {
      const x = i/(n-1);
      const noise = (Math.sin((i*freq + phase)*0.35) + 0.3*Math.sin(i*0.17 + phase*1.5));
      const y = 0.5 + amp * noise * (1 - x*0.2);
      return [ x, y ];
    });
  }

  // axes baseline for both
  [gTop, gBot].forEach((g,i) => {
    g.append("line").attr("x1",0).attr("x2",w).attr("y1", panelH/2).attr("y2", panelH/2)
      .attr("stroke","rgba(255,255,255,0.06)");
  });

  // top waveform
  const dataTop = waveform(720, 6 + Math.random()*6, 0.28, Math.random()*10);
  const xScale = d3.scaleLinear().domain([0,1]).range([0,w]);
  const yScaleTop = d3.scaleLinear().domain([0,1]).range([panelH,0]);
  const lineTop = d3.line()
    .x(d=>xScale(d[0]))
    .y(d=>yScaleTop(d[1]))
    .curve(d3.curveBasis);

  gTop.append("path").attr("d", lineTop(dataTop))
    .attr("fill","none")
    .attr("stroke","rgba(255,255,255,0.92)")
    .attr("stroke-width",1.2);

  // lower waveform (different)
  const dataBot = waveform(720, 8 + Math.random()*8, 0.22, Math.random()*10);
  const yScaleBot = d3.scaleLinear().domain([0,1]).range([panelH,0]);
  const lineBot = d3.line()
    .x(d=>xScale(d[0]))
    .y(d=>yScaleBot(d[1]))
    .curve(d3.curveNatural);

  gBot.append("path").attr("d", lineBot(dataBot))
    .attr("fill","none")
    .attr("stroke","rgba(255,255,255,0.92)")
    .attr("stroke-width",1.2);

  // small caption text at bottom
  svg.append("text").attr("x", TILE_W/2).attr("y", TILE_H - 18).attr("class","small-label")
    .attr("text-anchor","middle").text("SIGNAL / WAVEFORM");
})();

/* ========== simple hover tooltip handler for some tiles (optional) ========== */
// We provide a simple handler so tiles can show data when hovered (already used in other tiles if desired)
d3.selectAll(".tile").on("mousemove", function(event){
  // position tooltip near cursor if visible
  const [mx,my] = d3.pointer(event);
  tooltip.style("left", (event.clientX + 14) + "px").style("top", (event.clientY + 14) + "px");
});

</script>
</body>
</html>
