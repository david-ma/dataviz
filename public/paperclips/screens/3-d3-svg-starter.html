<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    .tile {
      cursor: pointer;
      transition: 0.2s;
    }
    .highlight {
      stroke: black;
      stroke-width: 2;
    }
  </style>
</head>

<body>

<svg id="svg" width="400" height="200"></svg>

<script>
// --- SVG ROOT ------------------------------------------------------
const svg = d3.select("#svg");

// --- TILE 3 GROUP --------------------------------------------------
const tile = svg.append("g")
  .attr("class", "tile")
  .attr("transform", "translate(40,40)");

// --- BACKGROUND RECT ----------------------------------------------
tile.append("rect")
  .attr("width", 180)
  .attr("height", 100)
  .attr("rx", 12)
  .attr("fill", "#f3f3f3");

// --- CIRCLE --------------------------------------------------------
tile.append("circle")
  .attr("cx", 50)
  .attr("cy", 50)
  .attr("r", 25)
  .attr("fill", "#8ecae6");

// --- LABEL ---------------------------------------------------------
tile.append("text")
  .attr("x", 100)
  .attr("y", 55)
  .attr("dominant-baseline", "middle")
  .attr("font-size", "18px")
  .attr("font-family", "sans-serif")
  .text("Tile 3");

// --- INTERACTIONS --------------------------------------------------
tile.on("mouseenter", function() {
  d3.select(this).select("rect").classed("highlight", true);
});

tile.on("mouseleave", function() {
  d3.select(this).select("rect").classed("highlight", false);
});

tile.on("click", function() {
  // Simple click toggle: shift tile by +10px each click
  const current = d3.select(this).attr("transform");
  const shift = parseInt(current.match(/translate\((\d+)/)[1]) + 10;
  d3.select(this).attr("transform", `translate(${shift},40)`);
});
</script>

</body>
</html>
